name: Desk dashboard prices and icons

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate icons and fetch prices
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow
          mkdir -p docs/desk-dashboard
          python3 scripts/desk_dashboard_icons.py --out docs/desk-dashboard
          python3 scripts/desk_dashboard_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/desk-dashboard/prices.json \
                  docs/desk-dashboard/icon-192.png \
                  docs/desk-dashboard/icon-512.png \
                  docs/desk-dashboard/apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update desk dashboard prices and icons"
          git push
